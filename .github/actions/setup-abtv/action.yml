name: Setup databaseab
description: Set up Node 20 and optionally install ffprobe

inputs:
  install-ffprobe:
    description: 'Whether to install ffprobe'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install ffprobe
      if: inputs.install-ffprobe == 'true'
      shell: bash
      run: |
        success=false
        for i in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends ffmpeg; then
            success=true
            break
          fi
          echo "attempt $i failed, refreshing package index and retrying..."
          sudo apt-get update
          sleep $((i * 10))
        done
        if [ "$success" != "true" ]; then
          echo "::error::ffmpeg install failed after 3 attempts, likely a stuck upstream mirror"
          exit 1
        fi
        ffprobe -version
