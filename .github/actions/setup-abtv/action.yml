# .github/actions/setup-abtv/action.yml
# ─────────────────────────────────────────────────────────────────────────────
# Composite action: checkout + Node.js + ffprobe.
# Used by check-alive, resurrect — any workflow that needs ffprobe.
# For ffprobe-free workflows (sync, check-youtube) just use this without
# the install-ffprobe input set to true, or omit it and use plain setup-node.
# ─────────────────────────────────────────────────────────────────────────────
name: Setup databaseab
description: Checkout repo, set up Node 20, optionally install ffprobe

inputs:
  install-ffprobe:
    description: 'Whether to install ffprobe (needed for HLS probing workflows)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install ffprobe
      if: inputs.install-ffprobe == 'true'
      shell: bash
      run: |
        wget -q https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
        sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
        ffprobe -version
