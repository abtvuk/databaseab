name: Setup databaseab
description: Set up Node 20 and optionally install ffprobe

inputs:
  install-ffprobe:
    description: 'Whether to install ffprobe'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install ffprobe
      if: inputs.install-ffprobe == 'true'
      shell: bash
      run: |
        wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-23-13-52/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
        sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
        ffprobe -version
