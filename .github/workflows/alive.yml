name: Check Alive Channels
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  check-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv
        with:
          install-ffprobe: 'true'

      - name: Check alive channels
        run: node scripts/alive.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/channels.json
          [ -f feeds/archive.json ] && git add feeds/archive.json || true
          [ -f feeds/dead.json ] && git add feeds/dead.json || true
          [ -f feeds/deadLinks.json ] && git add feeds/deadLinks.json || true
          git diff --staged --quiet || git commit -m "chore: check alive channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase
          git push
