name: Check YouTube Channels

# ── Schedule ──────────────────────────────────────────────────────────────────
# Probes all YouTube channels (ytId set, probe: true) every 12 hours.
# YouTube channels are more stable than HLS streams so 12h is sufficient.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check YouTube channels
        run: node scripts/check-youtube.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json
          git diff --staged --quiet || git commit -m "chore: check YouTube channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
