name: Check YouTube Channels

# ── Schedule ──────────────────────────────────────────────────────────────────
# Mirrors config.js → schedules.checkYoutube  (every 12 hours)
# YouTube channels are more stable than HLS streams so 12h is sufficient.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv

      - name: Check YouTube channels
        run: node scripts/check-youtube.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/youtube.json
          git diff --staged --quiet || git commit -m "chore: check YouTube channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
