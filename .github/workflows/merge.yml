name: Build & Check Streams

on:
  push:
    paths:
      - 'feeds/iptv/**'
      - 'feeds/youtube/**'
      - 'feeds/custom/**'
      - 'config.js'
  schedule:
    # Schedule is defined in config.js — update it there, then mirror here.
    # Current value: every 6 hours  →  '0 */6 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & check streams
        run: node scripts/build.js

      - name: Commit updated feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json feeds/merged/dead-channels.json
          git diff --staged --quiet || git commit -m "chore: update merged channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
