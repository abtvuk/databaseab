name: Merge & Check Streams

on:
  push:
    paths:
      - 'feeds/iptv/**'
      - 'feeds/youtube/**'
      - 'feeds/custom/**'
      - 'config.js'
  schedule:
    # Schedule is defined in config.js — update it there, then mirror here.
    # Current value: every 6 hours  →  '0 */6 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  merge-and-check:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit merged output back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify ffprobe is available
        run: ffprobe -version | head -1

      - name: Merge sources
        run: node scripts/merge.js

      - name: Check streams
        run: node scripts/check-streams.js

      - name: Commit updated merged files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged/channels.json merged/dead-channels.json
          git diff --staged --quiet || git commit -m "chore: update merged channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
