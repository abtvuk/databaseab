name: Sync from iptv-org
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv

      - name: Sync from iptv-org
        run: node scripts/sync.js

      - name: Commit updated channel list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json feeds/merged/youtube.json
          git diff --staged --quiet || git commit -m "chore: sync channels from iptv-org [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
