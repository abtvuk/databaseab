name: Synchroniser
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv
        with:
          install-ffprobe: 'true'

      - name: Sync from iptv-org
        run: |
          b1=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          node scripts/sync.js
          b2=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          echo "network bytes: $((b2-b1))"

      - name: Commit updated channel list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/channels.json
          git diff --staged --quiet || git commit -m "chore: sync channels from iptv-org [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3; do
            timeout 60 git pull --rebase --autostash && timeout 60 git push && exit 0
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "plain retries exhausted, falling back to conflict-tolerant rebase (keeps already-landed remote data on any conflicting hunk; this run's findings get re-probed next cycle)"
          git rebase --abort 2>/dev/null || true
          timeout 60 git pull --rebase -X ours --autostash && timeout 60 git push && exit 0
          echo "::error::failed to push even with conflict-tolerant fallback"
          exit 1

      - name: Optimize channel logos
        run: |
          b1=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          node scripts/logos.js
          b2=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          echo "network bytes: $((b2-b1))"

      - name: Commit optimized logos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/logos feeds/logos-manifest.json
          git diff --staged --quiet || git commit -m "chore: optimize channel logos [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3; do
            timeout 60 git pull --rebase --autostash && timeout 60 git push && exit 0
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "plain retries exhausted, falling back to conflict-tolerant rebase (keeps already-landed remote data on any conflicting hunk; this run's findings get re-probed next cycle)"
          git rebase --abort 2>/dev/null || true
          timeout 60 git pull --rebase -X ours --autostash && timeout 60 git push && exit 0
          echo "::error::failed to push even with conflict-tolerant fallback"
          exit 1
