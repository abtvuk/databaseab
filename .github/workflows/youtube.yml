name: YouTube
on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv

      - name: Check YouTube channels
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/youtube.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/youtube.json
          git diff --staged --quiet || git commit -m "chore: check YouTube channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3; do
            timeout 60 git pull --rebase --autostash && timeout 60 git push && exit 0
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "plain retries exhausted, falling back to conflict-tolerant rebase (keeps already-landed remote data on any conflicting hunk; this run's findings get re-probed next cycle)"
          git rebase --abort 2>/dev/null || true
          timeout 60 git pull --rebase -X ours --autostash && timeout 60 git push && exit 0
          echo "::error::failed to push even with conflict-tolerant fallback"
          exit 1
