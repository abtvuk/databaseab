name: Check YouTube Channels
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv

      - name: Check YouTube channels
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/youtube.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/youtube.json
          git diff --staged --quiet || git commit -m "chore: check YouTube channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase
          git push
