name: Resurrect Dead Channels

# ── Schedule ──────────────────────────────────────────────────────────────────
# Mirrors config.js → schedules.resurrect  (every 4 hours)
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  resurrect:
    runs-on: ubuntu-latest
    timeout-minutes: 220

    permissions:
      contents: write

    steps:
      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv
        with:
          install-ffprobe: 'true'

      - name: Resurrect dead channels
        run: node scripts/resurrect.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json feeds/merged/archive.json
          git diff --staged --quiet || git commit -m "chore: resurrect dead channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase
          git push
