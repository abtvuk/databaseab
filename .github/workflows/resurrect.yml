name: Resurrect Dead Channels

# ── Schedule ──────────────────────────────────────────────────────────────────
# Probes all dead channels (alive: false, probe: true) every 4 hours.
# Mirrors config.js → schedules.resurrect
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  resurrect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resurrect dead channels
        run: node scripts/resurrect.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json
          git diff --staged --quiet || git commit -m "chore: resurrect dead channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
