name: Ressusciter
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  resurrect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv
        with:
          install-ffprobe: 'true'

      - name: Log runner IP
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          echo "runner IP: $IP"
          curl -s --max-time 10 "https://ipinfo.io/$IP/json" || true

      - name: Resurrect dead channels
        run: |
          b1=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          node scripts/resurrect.js
          b2=$(awk 'NR>2{sub(/:/,"",$1); if($1!="lo"){rx+=$2; tx+=$10}} END{print rx+tx}' /proc/net/dev)
          echo "network bytes: $((b2-b1))"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/channels.json
          [ -f feeds/archive.json ] && git add feeds/archive.json || true
          [ -f feeds/dead.json ] && git add feeds/dead.json || true
          [ -f feeds/deadLinks.json ] && git add feeds/deadLinks.json || true
          git diff --staged --quiet || git commit -m "chore: resurrect dead channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3; do
            timeout 60 git pull --rebase --autostash && timeout 60 git push && exit 0
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "plain retries exhausted, falling back to conflict-tolerant rebase (keeps already-landed remote data on any conflicting hunk; this run's findings get re-probed next cycle)"
          git rebase --abort 2>/dev/null || true
          timeout 60 git pull --rebase -X ours --autostash && timeout 60 git push && exit 0
          echo "::error::failed to push even with conflict-tolerant fallback"
          exit 1
