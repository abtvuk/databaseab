name: Check Alive Channels

# ── Schedule ──────────────────────────────────────────────────────────────────
# Mirrors config.js → schedules.checkAlive  (every 5 hours)
# Effective per-channel probe intervals (from config.js → probeFrequency):
#   no history  → every run (always)
#   score < 70% → every 5h
#   score 70–79%→ every 8h
#   score 80–84%→ every 12h
#   score ≥ 85% → every 24h
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: channel-data
  cancel-in-progress: false

jobs:
  check-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    permissions:
      contents: write

    steps:
      - name: Setup databaseab
        uses: ./.github/actions/setup-abtv
        with:
          install-ffprobe: 'true'

      - name: Check alive channels
        run: node scripts/check-alive.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/merged/channels.json feeds/merged/archive.json
          git diff --staged --quiet || git commit -m "chore: check alive channels [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase
          git push
